global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend seppen_http
    bind :8080
    default_backend seppen_nodes

backend seppen_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server seppen-a seppen-a:21285 check
    server seppen-b seppen-b:21285 check
    server seppen-c seppen-c:21285 check
